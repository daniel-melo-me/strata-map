name: Validar conteúdo

# Confere peças, conexões, jornadas, modo falha, zoom e busca a cada push e pull request.
on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar dados e referências
        run: node tests/validate.js
